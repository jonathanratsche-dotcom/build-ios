name: Build iOS
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Tools
        run: brew install wget

      - name: Download Godot Stable
        run: |
          mkdir -p build/ios
          wget -q https://github.com
          unzip -q Godot_v4.3-stable_macos.universal.zip

      - name: Export Godot Project
        run: |
          ./Godot.app/Contents/MacOS/Godot --headless --export-release "iOS" build/ios/JumpingKnight.ipa

      - name: Save IPA File
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build/ios/


