name: Build iOS
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      
      - name: Download Godot
        run: |
          mkdir -p build/ios
          curl -L -o godot.zip "https://tuxfamily.org"
          unzip godot.zip
          
      - name: Export Project to IPA
        run: |
          ./Godot.app/Contents/MacOS/Godot --headless --export-release "iOS" build/ios/JumpingKnight.ipa
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build/ios/

