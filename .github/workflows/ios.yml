name: Build iOS
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Godot 4.3
        run: |
          wget https://github.com
          unzip Godot_v4.3-stable_macos.universal.zip
          
      - name: Export Project to IPA
        run: |
          mkdir -p build/ios
          ./Godot.app/Contents/MacOS/Godot --headless --export-release "iOS" build/ios/JumpingKnight.ipa
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build/ios/
